---
format_version: "23"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

meta:
  bitrise.io:
    stack: osx-xcode-26.0.x
    machine_type_id: g2-m1.4core

app:
  envs:
    - BITRISE_PROJECT_PATH: Picke.xcworkspace
    - BITRISE_SCHEME: Picke-Stage
    - BITRISE_RELEASE_SCHEME: Picke-Prod
    - BITRISE_CONFIGURATION: Release
    # TEAM_ID / APPLE_ID / APP_STORE_CONNECT_* / MATCH_KEYCHAIN_PASSWORD 등
    # 시크릿은 Bitrise 대시보드(App → Env Vars / Secrets)에 등록한다.

# 공통 준비: mise(tuist) + bundler(fastlane) 설치 후 Tuist 프로젝트 생성
workflows:
  _setup:
    steps:
      # 메인 repo(Picke-iOS)는 public → 인증 불필요.
      # private config/인증서 repo 는 아래 스크립트에서 GITHUB_TOKEN HTTPS 로 접근.
      - git-clone@8: {}
      # SPM/tuist/mise 캐시 복원 (Package.resolved 변경 시 자동 무효화)
      - restore-cache@3:
          inputs:
            - key: |-
                spm-{{ .OS }}-{{ checksum "Tuist/Package.resolved" }}
                spm-{{ .OS }}-
      - script@1:
          title: Install mise + tuist + generate
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -exo pipefail
                # GitHub 토큰으로 SSH→HTTPS 치환 (private config 클론 + match 접근)
                git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
                git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
                # fastlane match 가 토큰 HTTPS 로 인증서 repo 를 읽도록 URL 주입
                envman add --key MATCH_GIT_URL --value "https://x-access-token:${GITHUB_TOKEN}@github.com/Roy-wonji/FastlaneMatch.git"
                # 미커밋 시크릿(xcconfig + .env)을 private config repo 에서 복원
                rm -rf /tmp/ios-config
                git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/SWYP-Find/iOS-Config.git /tmp/ios-config
                mkdir -p Config fastlane
                cp /tmp/ios-config/Config/*.xcconfig Config/
                cp /tmp/ios-config/fastlane/.env fastlane/.env
                # mise + tuist
                curl -fsSL https://mise.run | sh
                export PATH="$HOME/.local/bin:$PATH"
                eval "$($HOME/.local/bin/mise activate bash)"
                mise install
                mise exec -- tuist install
                mise exec -- tuist generate --no-open

  # TestFlight 업로드 (Stage) — fastlane QA 레인
  qa:
    before_run:
      - _setup
    steps:
      # git 로그 → 릴리스 노트(RELEASE_NOTES) 자동 생성. fastlane changelog 로 전달.
      - script@1:
          title: Generate release notes
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -eo pipefail
                # 머지/빌드번호/CI 커밋 제외하고 최근 커밋 메시지 수집
                NOTES=$(git log -n 15 --no-merges --pretty=format:"- %s" \
                  | grep -vE '^- (Merge|chore: 빌드|chore: bump|ci:)' \
                  | head -10)
                [ -z "$NOTES" ] && NOTES="버그 수정 및 개선"
                envman add --key RELEASE_NOTES --value "$NOTES"
                echo "릴리스 노트:"; echo "$NOTES"
      - fastlane@3:
          inputs:
            - lane: QA
      # 빌드 산출물(SPM/tuist/mise) 캐시 저장
      - save-cache@1:
          inputs:
            - key: spm-{{ .OS }}-{{ checksum "Tuist/Package.resolved" }}
            - paths: |-
                ~/Library/Caches/org.swift.swiftpm
                ~/.cache/tuist
                ~/.local/share/mise
                Tuist/.build
      - deploy-to-bitrise-io@2: {}

  # App Store 배포 (Prod) — fastlane release 레인. version 은 트리거/수동 입력.
  release:
    before_run:
      - _setup
    steps:
      - script@1:
          title: Derive version from tag
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euxo pipefail
                # 태그(v1.0.3)가 있으면 거기서, 없으면(release 브랜치 push) appVersion 에서 추출
                VER="${BITRISE_GIT_TAG#v}"
                if [ -z "$VER" ]; then
                  EXT="Plugins/ProjectTemplatePlugin/ProjectDescriptionHelpers/Project+Templete/Extension+String.swift"
                  VER=$(grep -oE 'appVersion\(version: String = "[0-9.]+"' "$EXT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
                fi
                VER="${VER:-$RELEASE_VERSION}"
                envman add --key RELEASE_VERSION --value "$VER"
                echo "릴리스 버전: $VER"
      - fastlane@3:
          inputs:
            - lane: "release version:$RELEASE_VERSION"
      - deploy-to-bitrise-io@2: {}

# Pipelines: 워크플로를 파이프라인으로 감싸 Pipelines 탭/다이어그램에서 실행·시각화.
# (iOS 전용·단일 fastlane 레인이라 현재는 단일 스테이지. 추후 단계 추가 가능.)
pipelines:
  deploy-qa:
    # Tag: qa/* → TestFlight(Stage)
    triggers:
      tag:
        - name: "qa/*"
    workflows:
      qa: {}
  deploy-prod:
    # Push: release 브랜치 push/merge / Tag: v* → Prod(App Store) 배포
    triggers:
      push:
        - branch: release
      tag:
        - name: "v*"
    workflows:
      release: {}
