name: Gemini Code Review

on:
  pull_request:
    branches:
      - develop
      - main
      - master
    types: [opened, synchronize]

concurrency:
  group: gemini-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get PR Context and Filtered Git Diff
        id: get_diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$BASE_SHA" "$HEAD_SHA"
          git -c core.quotePath=false diff "$BASE_SHA...$HEAD_SHA" -- "*.swift" > diff.txt
          if [ ! -s diff.txt ]; then
            echo "skip_review=true" >> $GITHUB_OUTPUT
          else
            echo "skip_review=false" >> $GITHUB_OUTPUT
          fi

      - name: Check Existing Gemini Review
        if: steps.get_diff.outputs.skip_review == 'false'
        id: existing_review
        uses: actions/github-script@v7
        with:
          script: |
            const headSHA = context.payload.pull_request.head.sha;
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            };
            const reviews = await github.paginate(github.rest.pulls.listReviews, request);
            const marked = reviews
              .filter((item) => item.user?.login === "github-actions[bot]")
              .map((item) => ({
                item,
                match: item.body?.match(/<!-- gemini-code-review head=([0-9a-f]+) inline=(\d+) -->\s*$/),
              }))
              .find(({ match }) => match?.[1] === headSHA);
            if (marked) {
              const expected = Number(marked.match[2]);
              for (let attempt = 0; attempt < 5; attempt++) {
                if (attempt) await new Promise((resolve) => setTimeout(resolve, 2000));
                const comments = await github.paginate(github.rest.pulls.listComments, request);
                const actual = comments.filter((item) => item.pull_request_review_id === marked.item.id).length;
                if (actual === expected) {
                  core.setOutput("already_reviewed", "true");
                  return;
                }
                console.log(`Review ${marked.item.id} has ${actual}/${expected} inline comments for ${headSHA}`);
              }
              // A deleted bot comment can leave this mismatch until the PR head changes.
              throw new Error(`Incomplete persisted review for ${headSHA}`);
            }
            // Older summary-only issue comments have no SHA receipt and cannot be
            // attributed safely; legacy PR reviews expose commit_id.
            const legacy = reviews.find((item) => item.commit_id === headSHA
              && item.user?.login === "github-actions[bot]"
              && !item.body?.includes("<!-- gemini-code-review head="));
            if (legacy) {
              console.log(`Found legacy review ${legacy.id} for ${headSHA}`);
              core.setOutput("already_reviewed", "true");
            }

      - name: Install GoogleGenerativeAI
        if: steps.get_diff.outputs.skip_review == 'false' && steps.existing_review.outputs.already_reviewed != 'true'
        run: npm install @google/generative-ai

      - name: Parse Diff for Valid Lines and Annotate
        if: steps.get_diff.outputs.skip_review == 'false' && steps.existing_review.outputs.already_reviewed != 'true'
        uses: actions/github-script@v7
        id: parse_diff
        with:
          script: |
            const fs = require("fs");
            const diff = fs.readFileSync("diff.txt", "utf8");
            const validLines = {};
            const lineContentMap = {};
            const annotatedLines = [];
            let currentFile = null;
            let lineNum = 0;
            for (const line of diff.split("\n")) {
              if (line.startsWith("diff --git")) {
                currentFile = null;
                annotatedLines.push(line);
                continue;
              }
              if (line.startsWith("+++ ")) {
                let path = line.slice(4).replace(/\t$/, "");
                if (path.startsWith('"') && path.endsWith('"')) {
                  try { path = JSON.parse(path); } catch { path = ""; }
                }
                currentFile = path.startsWith("b/") ? path.slice(2) : null;
                annotatedLines.push(line);
                continue;
              }
              if (line.startsWith("---") || line.startsWith("index ")) {
                annotatedLines.push(line);
                continue;
              }
              if (line.startsWith("@@") && currentFile) {
                const match = line.match(/@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@/);
                if (match) lineNum = parseInt(match[1]);
                annotatedLines.push(line);
                continue;
              }
              if (!currentFile) {
                annotatedLines.push(line);
                continue;
              }
              if (line.startsWith("+") && !line.startsWith("+++")) {
                if (!validLines[currentFile]) validLines[currentFile] = new Set();
                validLines[currentFile].add(lineNum);
                if (!lineContentMap[currentFile]) lineContentMap[currentFile] = {};
                lineContentMap[currentFile][lineNum] = line.substring(1).trim();
                annotatedLines.push(`[LINE ${lineNum}] ${line}`);
                lineNum++;
              } else if (line.startsWith("-") && !line.startsWith("---")) {
                annotatedLines.push(`[DEL] ${line}`);
              } else if (line.startsWith(" ")) {
                annotatedLines.push(`[CTX ${lineNum}] ${line}`);
                lineNum++;
              } else {
                // Metadata such as "\\ No newline at end of file" is not a source line.
                annotatedLines.push(line);
              }
            }
            const serializable = {};
            for (const [file, lines] of Object.entries(validLines)) {
              serializable[file] = [...lines].sort((a, b) => a - b);
            }
            fs.writeFileSync("valid_lines.json", JSON.stringify(serializable));
            fs.writeFileSync("line_content_map.json", JSON.stringify(lineContentMap));
            fs.writeFileSync("annotated_diff.txt", annotatedLines.join("\n"));

      - name: Run Gemini Review
        if: steps.get_diff.outputs.skip_review == 'false' && steps.existing_review.outputs.already_reviewed != 'true'
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require("fs");
            const annotated_diff = fs.readFileSync("annotated_diff.txt", "utf8");
            const pr_title = context.payload.pull_request.title;
            const pr_body = context.payload.pull_request.body || "내용 없음";
            const { GoogleGenerativeAI } = require("@google/generative-ai");
            const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
            const model = genAI.getGenerativeModel({
              model: "gemini-2.5-flash",
              generationConfig: {
                responseMimeType: "application/json",
              },
            });
            const promptLines = [
              "You are a senior iOS engineer performing a code review on a Swift 6 / SwiftUI / TCA 1.25 multi-module Clean Architecture project built with Tuist 4.",
              "",
              "[Tone and Style Guidelines]",
              "- Do NOT include unnecessary praise, greetings, or overly verbose explanations.",
              "- Do NOT provide unsolicited CS insights (컴퓨터 과학적 통찰) or related interview questions.",
              "- Provide concise, objective, and well-organized feedback suitable for immediate practical use.",
              "",
              "CRITICAL LINE NUMBER RULES (MUST FOLLOW):",
              "- Each diff line is annotated with [LINE N] for added lines or [CTX N] for context lines.",
              "- You MUST only comment on [LINE N] lines (added/modified code). NEVER comment on [CTX] or [DEL] lines.",
              "- Use the EXACT number N shown in the [LINE N] annotation. Do NOT compute line numbers yourself.",
              "- The \"code_snippet\" field must contain the actual code from that [LINE N] line.",
              "",
              "[PR Context]",
              "Title: " + pr_title,
              "Description: " + pr_body,
              "",
              "[Project Architecture]",
              "- Stack: Swift 6, SwiftUI, TCA 1.25, Tuist 4 (multi-module)",
              "- Layer dependency: Presentation → Domain ← Data, Network is only referenced by Data",
              "- Deployment target: iOS 17.0+ (iPhone only)",
              "- Use only the project conventions stated here; do not infer rules from a generic iOS template.",
              "",
              "[Review Criteria]",
              "1. Prioritize reproducible behavior bugs: incorrect API mapping, state transitions, navigation, cancellation, authentication, crashes, and data loss. Explain the specific failing path and why the changed line causes it.",
              "2. Mandatory AGENTS.md rules: Feature IO goes through a UseCase, never a Repository dependency; DTO-to-Entity mapping stays in Data; TCA Views hold StoreOf<Feature> with @Bindable; SwiftUI body contains top-level layout while sections live in an extension; a subview with 2+ children uses @ViewBuilder private func, a single view uses private var; use Pretendard font and design color tokens, not .font(.system(...)) or raw hex colors. Report a changed-line violation only when the relevant rule and consequence are clear.",
              "3. View-suffixed SwiftUI types, the prescribed @ViewBuilder/private-var subviews, and two-space indentation are valid project patterns. Do not demand a generic repository/interface layout.",
              "4. A suggestion block is optional. Include one only when its exact replacement is correct and complete; otherwise describe the minimal fix in prose.",
              "",
              "[Severity Prefix]",
              "Each comment body MUST start with a severity tag on its own line, then a blank line, then the actual comment:",
              "- 🔴 [P1] Critical: a concrete crash, security/privacy failure, data loss, or primary flow failure",
              "- 🟠 [P2] Major: a concrete incorrect state, API, navigation, concurrency, or module-boundary behavior",
              "Do not emit P3/P4/P5, optional style feedback, speculative risks, or comments that merely restate a rule without showing a concrete violation. A mandatory AGENTS.md rule violation with clear changed-line evidence can be P2.",
              "",
              "Format: \"🔴 **[P1] Critical**\\n\\nActual comment content here...\"",
              "",
              "Ignore optional formatting, naming, View suffixes, Spacer placement, import ordering, and comments. Apply the mandatory subview rule above when it is actually violated.",
              "",
              "Report at most five distinct, evidence-backed P1/P2 findings. If more substantive findings remain, summarize them concisely in summary. Prefer no comments over uncertain findings. Write in Korean Markdown without greetings or closings.",
              "",
              "Respond ONLY with a JSON object in this exact format:",
              "{",
              "  \"summary\": \"전체 리뷰 요약 (한국어, 마크다운)\",",
              "  \"comments\": [",
              "    {",
              "      \"path\": \"file path relative to repo root (from the b/ prefix in diff)\",",
              "      \"line\": <exact N from [LINE N] annotation>,",
              "      \"code_snippet\": \"the actual code content from that line\",",
              "      \"body\": \"🔴/🟠 **[P1/P2] Label**\\n\\n실패 경로, 원인, 수정 방향 (한국어, 마크다운)\"",
              "    }",
              "  ]",
              "}",
              "If no issues are found, return {\"summary\": \"...\", \"comments\": []}.",
              "",
              "<annotated_diff>",
              annotated_diff,
              "</annotated_diff>"
            ];
            const prompt = promptLines.join("\n");
            const result = await model.generateContent(prompt);
            const text = result.response.text();
            fs.writeFileSync("review_result.json", text);

      - name: Post Inline Review Comments
        if: steps.get_diff.outputs.skip_review == 'false' && steps.existing_review.outputs.already_reviewed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const raw = fs.readFileSync("review_result.json", "utf8");
            const validLinesMap = JSON.parse(fs.readFileSync("valid_lines.json", "utf8"));
            const lineContentMap = JSON.parse(fs.readFileSync("line_content_map.json", "utf8"));
            let review;
            try {
              review = JSON.parse(raw);
            } catch (e) {
              throw new Error(`Gemini returned invalid JSON: ${e.message}`);
            }

            if (!review || typeof review !== "object" || Array.isArray(review)
              || !Array.isArray(review.comments)) {
              throw new Error("Gemini review must be an object with a comments array");
            }

            // Never relocate an invalid line: that can attach a finding to unrelated code.
            const unverified = [];
            const validComments = review.comments.filter((c) => {
              const valid = c && typeof c.path === "string"
                && Number.isInteger(c.line)
                && validLinesMap[c.path]?.includes(c.line)
                && typeof c.code_snippet === "string"
                && c.code_snippet.trim().length > 0
                && lineContentMap[c.path]?.[c.line] === c.code_snippet.trim()
                && typeof c.body === "string"
                && /\[P[12]\]/.test(c.body);
              if (!valid && c && /\[P[12]\]/.test(String(c.body || ""))) {
                unverified.push(`- ${String(c.path || "unknown")}:${String(c.line || "?")} [미검증] ${String(c.body).replace(/\s+/g, " ").slice(0, 240)}`);
              }
              return valid;
            });
            const seen = new Set();
            const distinct = validComments.filter((c) => {
              const key = `${c.path}:${c.line}:${c.body}`;
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            });
            const inlineLimit = 5;
            const reviewComments = distinct.slice(0, inlineLimit).map((c) => ({
              path: c.path,
              line: c.line,
              side: "RIGHT",
              body: c.body,
            }));
            const overflow = distinct.slice(inlineLimit);
            const extraFindings = [
              ...overflow.map((c) => `- ${c.path}:${c.line} ${c.body.replace(/\s+/g, " ").slice(0, 240)}`),
              ...new Set(unverified),
            ];
            const overflowSummary = extraFindings.length
              ? "\n\n추가 확인 사항 (미검증 항목은 인라인 미게시):\n"
                + extraFindings.join("\n")
              : "";
            const headSHA = context.payload.pull_request.head.sha;
            const markerPrefix = `<!-- gemini-code-review head=${headSHA} inline=`;
            const marker = `${markerPrefix}${reviewComments.length} -->`;
            const body = `${String(review.summary || "확인된 P1/P2 문제 없음.")}${overflowSummary}\n\n${marker}`;
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            };

            async function persistedReview() {
              const reviews = await github.paginate(github.rest.pulls.listReviews, { ...request, per_page: 100 });
              const marked = reviews
                .filter((item) => item.user?.login === "github-actions[bot]")
                .map((item) => ({
                  item,
                  match: item.body?.match(/<!-- gemini-code-review head=([0-9a-f]+) inline=(\d+) -->\s*$/),
                }))
                .find(({ match }) => match?.[1] === headSHA);
              if (marked) {
                const expected = Number(marked.match[2]);
                const comments = await github.paginate(github.rest.pulls.listComments, { ...request, per_page: 100 });
                const actual = comments.filter((item) => item.pull_request_review_id === marked.item.id).length;
                if (actual !== expected) {
                  console.log(`Review ${marked.item.id} has ${actual}/${expected} inline comments for ${headSHA}`);
                  // Deleting a bot comment makes this mismatch permanent until a new head SHA.
                }
                return Number.isInteger(expected) && actual === expected ? "complete" : "incomplete";
              }

              // Reviews posted before the marker was introduced still count for this head.
              // Older summary-only issues.createComment posts have no SHA receipt and
              // cannot be safely attributed to this head; only PR reviews expose commit_id.
              const legacy = reviews.find((item) => item.commit_id === headSHA
                && item.user?.login === "github-actions[bot]"
                && !item.body?.includes("<!-- gemini-code-review head="));
              if (legacy) console.log(`Found legacy review ${legacy.id} for ${headSHA}`);
              return legacy ? "complete" : "missing";
            }

            const prior = await persistedReview();
            if (prior === "complete") {
              console.log(`Review for ${headSHA} is already persisted; skipping duplicate post.`);
              return;
            }
            if (prior === "incomplete") {
              // Never repost when a marked review exists. Allow bounded read-back
              // for delayed comment visibility, then keep the job failed if incomplete.
              for (let attempt = 1; attempt < 5; attempt++) {
                await new Promise((resolve) => setTimeout(resolve, 2000));
                if (await persistedReview() === "complete") return;
              }
              throw new Error(`Incomplete persisted review for ${headSHA}`);
            }

            let postError;
            try {
              await github.rest.pulls.createReview({
                ...request,
                event: "COMMENT",
                commit_id: headSHA,
                body,
                comments: reviewComments,
              });
            } catch (error) {
              postError = error;
              console.log(`Review POST returned ${error.status || error.message}; checking GitHub state.`);
            }

            // A 5xx may arrive after GitHub has saved the review. Read back before failing.
            let finalState = "missing";
            for (let attempt = 0; attempt < 5; attempt++) {
              if (attempt) await new Promise((resolve) => setTimeout(resolve, 2000));
              try {
                finalState = await persistedReview();
                if (finalState === "complete") return;
              } catch (error) {
                console.log(`Read-back attempt ${attempt + 1} failed: ${error.message}`);
              }
            }
            if (finalState === "incomplete") throw new Error(`Incomplete persisted review for ${headSHA}`);
            throw postError || new Error(`Review for ${headSHA} was not found after POST`);
