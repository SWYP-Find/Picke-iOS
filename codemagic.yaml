workflows:
  deploy-stg:
    name: Stage → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    cache:
      # SPM/Tuist 의존성 다운로드만 캐싱(빌드 속도↑). DerivedData(빌드 산출물)는 stale 모듈 위험으로 제외.
      cache_paths:
        - ~/Library/Caches/org.swift.swiftpm
        - ~/Library/Caches/tuist
        - $CM_BUILD_DIR/Tuist/.build
    environment:
      xcode: "26.0"
      vars:
        CONFIG_REPO: "SWYP-Find/iOS-Config"
        TUIST_VERSION: "4.154.0"
      groups:
        - picke   # Codemagic에 CONFIG_REPO_TOKEN, DISCORD_WEBHOOK 등록
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "develop"
          include: true
        - pattern: "release-stg-*"
          include: true
    scripts:
      - name: 비밀 자산 주입 + Tuist(make) generate
        script: |
          set -e
          # 비공개 Config 레포(SWYP-Find/iOS-Config)에서 .env / Config(xcconfig)만 복원
          # Fastfile/Matchfile/Appfile은 메인 레포 추적본 그대로 사용 (덮어쓰지 않음)
          git clone --depth 1 "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/${CONFIG_REPO}.git" /tmp/cfg
          mkdir -p Config fastlane
          cp /tmp/cfg/Config/*.xcconfig Config/
          cp /tmp/cfg/fastlane/.env       fastlane/.env
          mkdir -p Projects/App/Resources && cp /tmp/cfg/App/GoogleService-Info.plist Projects/App/Resources/GoogleService-Info.plist
          # match 인증서 레포를 SSH 대신 토큰 HTTPS로 clone (Codemagic엔 SSH키 없음)
          echo "MATCH_GIT_URL=https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/Roy-wonji/FastlaneMatch.git" >> "$CM_ENV"
          # 빌드번호는 Fastfile QA 레인이 App Store 최신 빌드+1로 자동 증가시킴
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(mise activate bash)"
          mise install "tuist@${TUIST_VERSION}"
          mise exec "tuist@${TUIST_VERSION}" -- bash -c 'tuist install && tuist generate --no-open'
          ls -d *.xcworkspace
      - name: 릴리스 노트 수집 ([v버전] + 요약 파일)
        script: |
          EXT="Plugins/ProjectTemplatePlugin/ProjectDescriptionHelpers/Project+Templete/Extension+String.swift"
          VER=$(grep -oE 'appVersion\(version: String = "[0-9.]+"' "$EXT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          BODY=$(cat fastlane/release_notes.txt 2>/dev/null)
          [ -z "$BODY" ] && BODY="- 버그 수정"
          NOTES="[v${VER}]
          ${BODY}"
          echo "RELEASE_NOTES<<__EOF__" >> "$CM_ENV"
          echo "$NOTES" >> "$CM_ENV"
          echo "__EOF__" >> "$CM_ENV"
          echo "릴리스 노트:"; echo "$NOTES"
      - name: Discord 빌드 시작 알림
        script: |
          python3 - <<'PY'
          import os, json, urllib.request
          msg = f"🛠️ **Picke** TestFlight(QA) 빌드 시작 · #{os.environ.get('BUILD_NUMBER','')}\n{os.environ.get('CM_BUILD_URL','')}"
          wh = os.environ.get('DISCORD_WEBHOOK','')
          if wh:
              req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
                                           headers={"Content-Type":"application/json","User-Agent":"Picke-CI/1.0"})
              try: urllib.request.urlopen(req); print("discord ok")
              except Exception as e: print("discord skip:", e)
          PY
      - name: Fastlane QA — Stage → TestFlight
        script: |
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(mise activate bash)"
          bundle install
          bundle exec fastlane ios QA
      - name: Discord 성공 알림 (멘션 + 릴리스 노트)
        script: |
          python3 - <<'PY'
          import os, json, urllib.request
          msg = "@everyone\n"
          msg += f"✅ **Picke** TestFlight 배포 완료 · #{os.environ.get('BUILD_NUMBER','')}"
          notes = os.environ.get('RELEASE_NOTES','').strip()
          if notes: msg += "\n" + notes
          url = os.environ.get('CM_BUILD_URL','')
          if url: msg += "\n" + url
          wh = os.environ.get('DISCORD_WEBHOOK','')
          if wh:
              req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
                                           headers={"Content-Type":"application/json","User-Agent":"Picke-CI/1.0"})
              try: urllib.request.urlopen(req); print("discord ok")
              except Exception as e: print("discord skip:", e)
          PY

  test:
    name: PR 유닛 테스트
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - ~/Library/Caches/org.swift.swiftpm
        - ~/Library/Caches/tuist
        - $CM_BUILD_DIR/Tuist/.build
    environment:
      xcode: "26.0"
      vars:
        CONFIG_REPO: "SWYP-Find/iOS-Config"
        TUIST_VERSION: "4.154.0"
      groups:
        - picke
    triggering:
      events:
        - pull_request
    scripts:
      - name: 자산 주입 + generate + 유닛 테스트
        script: |
          set -e
          git clone --depth 1 "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/${CONFIG_REPO}.git" /tmp/cfg
          mkdir -p Config fastlane
          cp /tmp/cfg/Config/*.xcconfig Config/
          cp /tmp/cfg/fastlane/.env fastlane/.env
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(mise activate bash)"
          mise install "tuist@${TUIST_VERSION}"
          mise exec "tuist@${TUIST_VERSION}" -- bash -c 'tuist install && tuist generate --no-open'
          mise exec "tuist@${TUIST_VERSION}" -- tuist test

  deploy-prod:
    name: Prod → App Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    cache:
      cache_paths:
        - ~/Library/Caches/org.swift.swiftpm
        - ~/Library/Caches/tuist
        - $CM_BUILD_DIR/Tuist/.build
    environment:
      xcode: "26.0"
      vars:
        CONFIG_REPO: "SWYP-Find/iOS-Config"
        TUIST_VERSION: "4.154.0"
      groups:
        - picke
    triggering:
      # 실제 App Store 제출이라 v* 태그로만 트리거
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: 비밀 자산 주입 + 릴리스 버전 + Tuist(make) generate
        script: |
          set -e
          git clone --depth 1 "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/${CONFIG_REPO}.git" /tmp/cfg
          mkdir -p Config fastlane
          cp /tmp/cfg/Config/*.xcconfig Config/
          cp /tmp/cfg/fastlane/.env       fastlane/.env
          mkdir -p Projects/App/Resources && cp /tmp/cfg/App/GoogleService-Info.plist Projects/App/Resources/GoogleService-Info.plist
          echo "MATCH_GIT_URL=https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/Roy-wonji/FastlaneMatch.git" >> "$CM_ENV"
          EXT="Plugins/ProjectTemplatePlugin/ProjectDescriptionHelpers/Project+Templete/Extension+String.swift"
          VER="${CM_TAG#v}"
          if [ -z "$VER" ]; then
            VER=$(grep -oE 'appVersion\(version: String = "[0-9.]+"' "$EXT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          fi
          echo "RELEASE_VERSION=$VER" >> "$CM_ENV"
          echo "📦 릴리스 버전: ${VER}"
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(mise activate bash)"
          mise install "tuist@${TUIST_VERSION}"
          mise exec "tuist@${TUIST_VERSION}" -- bash -c 'tuist install && tuist generate --no-open'
          ls -d *.xcworkspace
      - name: Discord 빌드 시작 알림
        script: |
          python3 - <<'PY'
          import os, json, urllib.request
          msg = f"🚀 **Picke** App Store(Prod) 빌드 시작 · {os.environ.get('RELEASE_VERSION','')} · #{os.environ.get('BUILD_NUMBER','')}\n{os.environ.get('CM_BUILD_URL','')}"
          wh = os.environ.get('DISCORD_WEBHOOK','')
          if wh:
              req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
                                           headers={"Content-Type":"application/json","User-Agent":"Picke-CI/1.0"})
              try: urllib.request.urlopen(req); print("discord ok")
              except Exception as e: print("discord skip:", e)
          PY
      - name: Fastlane release — Prod → App Store
        script: |
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(mise activate bash)"
          bundle install
          bundle exec fastlane ios release version:$RELEASE_VERSION
      - name: Discord 성공 알림
        script: |
          python3 - <<'PY'
          import os, json, urllib.request
          msg = f"@everyone\n🚀 **Picke** {os.environ.get('RELEASE_VERSION','')} App Store 제출 완료 · #{os.environ.get('BUILD_NUMBER','')}"
          url = os.environ.get('CM_BUILD_URL','')
          if url: msg += "\n" + url
          wh = os.environ.get('DISCORD_WEBHOOK','')
          if wh:
              req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
                                           headers={"Content-Type":"application/json","User-Agent":"Picke-CI/1.0"})
              try: urllib.request.urlopen(req); print("discord ok")
              except Exception as e: print("discord skip:", e)
          PY
