# 홈 여정: 홈 상단 헤더 → "지금 뜨는 배틀" / "Best 배틀" 섹션 확인 + 스크린샷
#
# 홈 헤더(HomeHeaderView): PicKé 로고 + 알림 벨 아이콘.
# 헤더는 sticky, 아래로 HeroCarousel(에디터 픽 캐러셀) → 지금 뜨는 배틀 → Best 배틀.
appId: io.Picke.co
---
- launchApp
# 로그인 상태라면 홈 탭이 기본. 홈 탭 보장(id: tab.0).
- tapOn:
    id: "tab.0"
    optional: true
- extendedWaitUntil:
    visible: "지금 뜨는 배틀"
    timeout: 15000
- takeScreenshot: home-01-top
# 하단 Best 배틀 섹션까지 스크롤 후 확인.
- scrollUntilVisible:
    element:
      text: "Best 배틀"
    direction: DOWN
    timeout: 15000
- assertVisible: "Best 배틀"
- takeScreenshot: home-02-best
- scroll
