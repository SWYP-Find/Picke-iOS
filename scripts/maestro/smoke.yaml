# Picke 스모크 테스트 (maestro) — 핵심 여정 묶음(비파괴)
#
# 로그인/탈퇴는 인증 상태를 바꾸므로 스모크에서 제외한다.
# 커버: 홈(지금 뜨는 배틀/Best 배틀) → 알림(모두 읽음) → 탐색(카테고리/정렬)
#       → 빠른 배틀(VS) → 마이(나의 철학자 유형).
#
# 주의: iOS 26.x 시뮬레이터에서는 maestro XCUITest 드라이버 채널이 연결되지
# 않아(hang) 실행 불가. iOS 18.6(iPhone 13 mini)에서 실행 권장.
#   maestro --device <UDID> test scripts/maestro/smoke.yaml
appId: io.Picke.co
---
- launchApp

# --- 홈 ---
- tapOn:
    id: "tab.0"
    optional: true
- extendedWaitUntil:
    visible: "지금 뜨는 배틀"
    timeout: 15000
- takeScreenshot: smoke-01-home
- scrollUntilVisible:
    element:
      text: "Best 배틀"
    direction: DOWN
    timeout: 15000
- assertVisible: "Best 배틀"

# --- 알림 (QA-47) ---
- tapOn:
    id: "tab.0"
- tapOn:
    point: "92%, 7%"        # 홈 헤더 벨 아이콘(접근성 라벨 없음 → 좌표 탭)
- extendedWaitUntil:
    visible: "알림"
    timeout: 10000
- tapOn:
    id: "notification.readAll"
    optional: true
- tapOn:
    text: "모두 읽음"
    optional: true
- takeScreenshot: smoke-02-notification
- back

# --- 탐색 (QA-39 상단바) ---
- tapOn:
    id: "tab.1"
- extendedWaitUntil:
    visible: "전체"
    timeout: 15000
- tapOn: "철학"
- tapOn: "전체"
- takeScreenshot: smoke-03-explore

# --- 빠른 배틀 (QA-46) ---
- tapOn:
    id: "tab.2"
- takeScreenshot: smoke-04-quickbattle

# --- 마이 ---
- tapOn:
    id: "tab.3"
- extendedWaitUntil:
    visible: "나의 철학자 유형"
    timeout: 15000
- takeScreenshot: smoke-05-mypage
