# 탐색 여정(QA-39 상단바): 탐색 탭 → 카테고리 전환(전체/철학/…) → 인기순/최신순 정렬
#
# 탐색 탭은 Hifi 모듈(HifiView). 카테고리 탭은 전체 너비 균등 분포(스크롤 없음),
# 카테고리: 전체/철학/문학/예술/과학/사회/역사. 정렬: 인기순/최신순.
appId: io.Picke.co
---
- launchApp
- tapOn:
    id: "tab.1"          # 탐색 탭
- extendedWaitUntil:
    visible: "전체"
    timeout: 15000
- takeScreenshot: explore-01-all
# 카테고리 전환
- tapOn: "철학"
- takeScreenshot: explore-02-philosophy
- tapOn: "역사"
- takeScreenshot: explore-03-history
- tapOn: "전체"
# 정렬 전환(인기순 → 최신순)
- assertVisible:
    text: "인기순"
    optional: true
- tapOn:
    text: "최신순"
    optional: true
- takeScreenshot: explore-04-latest
- tapOn:
    text: "인기순"
    optional: true
# 리스트 카드가 있으면 스크롤로 로드 확인(빈 상태 문구도 허용).
- assertVisible:
    text: ".*분|새로운 콘텐츠가 없습니다"
    optional: true
- scroll
- takeScreenshot: explore-05-list
