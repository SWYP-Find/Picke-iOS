# 회원 탈퇴 여정: 마이 → 설정 → 회원 탈퇴 → 사유 선택 → 제출/돌아가기
#
# 주의: 이 플로우는 실제 제출 시 계정을 삭제하므로 CI/공용 계정에서 실행 금지.
# 기본은 "픽케로 다시 돌아가기"로 취소한다. 제출 검증이 필요하면 별도 테스트 계정 사용.
appId: io.Picke.co
---
- launchApp
- tapOn:
    id: "tab.3"          # 마이 탭
- extendedWaitUntil:
    visible: "나의 철학자 유형"
    timeout: 15000
# 설정(톱니) 진입.
- tapOn:
    point: "92%, 7%"
- extendedWaitUntil:
    visible: "설정"
    timeout: 10000
- tapOn: "회원 탈퇴"
# 탈퇴 사유 화면(WithdrawReasonView).
- extendedWaitUntil:
    visible: "탈퇴 이유를 알려주세요"
    timeout: 10000
- takeScreenshot: withdraw-01-reasons
# 사유 선택(다중 선택 가능).
- tapOn: "자주 이용하지 않아요"
- tapOn: "이용할 시간이 없어요"
- takeScreenshot: withdraw-02-selected
- assertVisible: "제출하기"
# 기본: 제출하지 않고 취소(계정 보호). 실제 제출 검증은 테스트 계정에서만.
- tapOn: "픽케로 다시 돌아가기"
- takeScreenshot: withdraw-03-cancelled
